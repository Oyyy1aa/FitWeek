name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4 # MySQL 8.4 LTS
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: fitweek_test
          MYSQL_USER: fitweek
          MYSQL_PASSWORD: fitweek_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ufitweek -pfitweek_ci --silent"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      APP_ENV: test
      DATABASE_URL: mysql+asyncmy://fitweek:fitweek_ci@127.0.0.1:3306/fitweek_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+asyncmy://fitweek:fitweek_ci@127.0.0.1:3306/fitweek_test?charset=utf8mb4
      DATABASE_CONNECT_TIMEOUT_SECONDS: 3
      REDIS_ENABLED: true
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      REDIS_KEY_PREFIX: fitweek:test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Alembic upgrade
        run: alembic upgrade head

      - name: Pytest
        run: pytest -v
