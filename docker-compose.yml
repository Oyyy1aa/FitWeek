services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  mysql-ci:
    image: mysql:9.4
    profiles: ["mysql-ci"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: fitweek_test
      MYSQL_USER: fitweek_test
      MYSQL_PASSWORD: ${MYSQL_CI_PASSWORD:?set MYSQL_CI_PASSWORD outside version control}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u fitweek_test -p$$MYSQL_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 20
